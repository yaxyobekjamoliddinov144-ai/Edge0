name: Android debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and platform packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "ndk;28.2.13676358" "platforms;android-35" "build-tools;35.0.0"

      - name: Install CMake and Ninja
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Build engine
        working-directory: android
        run: |
          export NDK_DIR="$ANDROID_HOME/ndk/28.2.13676358"
          bash tools/llama/build_vendor_libs.sh

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: edge0-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
