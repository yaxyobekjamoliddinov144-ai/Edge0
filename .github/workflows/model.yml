name: Build 8B model

on:
  workflow_dispatch:

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python tools
        run: pip install -q huggingface_hub numpy gguf

      - name: Download 8B checkpoint
        working-directory: android
        run: |
          mkdir -p models
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='Edge0/Edge0-8B-A1B-preview', local_dir='models/edge0-8b')"

      - name: Convert to GGUF
        working-directory: android
        run: python ../windows/tools/convert_mlx_to_gguf.py --dir models/edge0-8b

      - name: Save conversion log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge0-convert-log
          path: android/models/edge0-8b-gguf/convert.log
          if-no-files-found: warn

      - name: Save GGUF files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge0-8b-gguf
          path: android/models/edge0-8b-gguf/
          if-no-files-found: warn
